name: PR DeepAgent Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  ai_review:
    # Ignore comments created by bots to prevent infinite feedback loops
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write
      checks: write

    steps:
      - name: Trigger PR Review or Command on Local DeepAgent Server
        env:
          PR_URL: ${{ github.event.pull_request.html_url || github.event.issue.html_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ github.event.comment.body || '' }}
          SERVER_URL: ${{ secrets.PR_AGENT_SERVER_URL }}
        run: |
          python3 -c "
          import json, os, urllib.request

          payload = {
              'pr_url': os.environ.get('PR_URL', ''),
              'token': os.environ.get('GITHUB_TOKEN', ''),
              'post_review': True,
              'post_check': True,
              'comment_body': os.environ.get('COMMENT_BODY', '')
          }
          req = urllib.request.Request(
              f\"{os.environ['SERVER_URL']}/api/v1/review\",
              data=json.dumps(payload).encode('utf-8'),
              headers={'Content-Type': 'application/json'}
          )
          with urllib.request.urlopen(req) as response:
              print(response.read().decode('utf-8'))
          "
