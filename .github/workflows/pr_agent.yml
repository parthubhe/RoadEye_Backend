name: PR DeepAgent Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  ai_review:
    # Ignore comments created by bots to prevent loops
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      issues: write
      checks: write

    steps:
      - name: Trigger PR Review on Local DeepAgent Server
        run: |
          curl -s -X POST "${{ secrets.PR_AGENT_SERVER_URL }}/api/v1/review" \
            -H "Content-Type: application/json" \
            -d '{
              "pr_url": "${{ github.event.pull_request.html_url || github.event.issue.pull_request.html_url }}",
              "token": "${{ secrets.GITHUB_TOKEN }}",
              "post_review": true,
              "post_check": true
            }'
